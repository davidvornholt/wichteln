# Shared non-secret development configuration, keyed like secrets/dev.yaml
# (apps.<name>, packages.<name>). `just dev-env-generate` composes each
# workspace's .env.local from the dev layers. The local layer overrides the
# shared layers. A key never lives in both this file and secrets/dev.yaml.
apps:
  web:
    DATABASE_URL: &databaseUrl postgresql://wichteln:wichteln@127.0.0.1:15436/wichteln_dev
    # The origin that personal links point to.
    PUBLIC_ORIGIN: http://localhost:3000
packages:
  db:
    # The app and the migration tooling share one local database.
    DATABASE_URL: *databaseUrl
